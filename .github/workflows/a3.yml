
name: 🔄 A3 (8 min)
on:
  repository_dispatch:
    types: [run_A3]
  workflow_dispatch: {}
permissions:
  actions: write
  contents: write
env:
  ROUTING_MODE: ${{ vars.ROUTING_MODE || 'AGDM' }}
jobs:
  a3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🛡️ Guard - cancel if another A3 is running
        id: guard
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const myRunId = context.runId;
            // Find this workflow's ID from the current run
            const me = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: myRunId
            });
            const workflowId = me.data.workflow_id;
            // Look for other active runs of this same workflow
            const others = [];
            for (const status of ['in_progress', 'queued', 'waiting', 'pending']) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo,
                workflow_id: workflowId,
                status,
                per_page: 100
              });
              for (const run of runs.data.workflow_runs) {
                // Only count OTHER runs that started earlier (lower ID) to avoid both cancelling each other
                if (run.id !== myRunId && run.id < myRunId) {
                  others.push(run);
                }
              }
            }
            if (others.length === 0) {
              console.log('[A3-GUARD] ✅ No other A3 running. Continuing.');
              core.setOutput('skip', 'false');
              return;
            }
            console.log(`[A3-GUARD] ⛔ Another A3 is running: ${others.map(r => '#' + r.id + ' (' + r.status + ')').join(', ')}`);
            console.log('[A3-GUARD] Cancelling myself...');
            core.setOutput('skip', 'true');
            await github.rest.actions.cancelWorkflowRun({
              owner, repo, run_id: myRunId
            });
            // Give GitHub time to process the cancellation
            await new Promise(r => setTimeout(r, 30000));
      - name: 🚀 A3 Work
        if: steps.guard.outputs.skip != 'true'
        run: |
          echo "⏳ A3 started at $(date)"
          sleep 20
          echo "✅ A3 done at $(date)"
      - name: 🔍 Fetch regime from Worker
        if: steps.guard.outputs.skip != 'true'
        id: regime
        env:
          WORKER_JSON_URL: ${{ secrets.WORKER_JSON_URL }}
        run: |
          set +e
          echo "🔗 Fetching from Worker..."
          JSON=$(curl -fsS --max-time 10 "${WORKER_JSON_URL}")
          EXIT_CODE=$?
          echo "🔢 Curl Exit Code: $EXIT_CODE"
          if [[ $EXIT_CODE -ne 0 || -z "$JSON" ]]; then
            echo "⚠️ Fetch failed"
            REGIME="Unknown"
          else
            REGIME=$(echo "$JSON" | grep -oE '(Dead Market|Altcoin Season)' | head -n1)
            if [[ -z "$REGIME" ]]; then
              REGIME="Unknown"
            fi
          fi
          echo "regime=$REGIME" >> "$GITHUB_OUTPUT"
          echo "✅ Final Regime: $REGIME"
      - name: 🔁 Route based on ROUTING_MODE
        if: steps.guard.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const mode = `${{ env.ROUTING_MODE }}`.trim().toUpperCase();
            const regime = `${{ steps.regime.outputs.regime }}`.trim();
            const isDead = regime === 'Dead Market';
            let eventType;
            switch (mode) {
              case 'AGDM':
                // Dead → MEXC (A), Alt → BYBIT (B)
                eventType = isDead ? 'run_A' : 'run_B';
                break;
              case 'AMDG':
                // Dead → BYBIT (B), Alt → MEXC (A)
                eventType = isDead ? 'run_B' : 'run_A';
                break;
              case 'OG':
                // Always BYBIT (B)
                eventType = 'run_B';
                break;
              case 'OM':
                // Always MEXC (A)
                eventType = 'run_A';
                break;
              default:
                console.log(`⚠️ Unknown mode "${mode}", defaulting to AGDM`);
                eventType = isDead ? 'run_A' : 'run_B';
            }
            const workflowFiles = {
              run_A: 'blank2.yml',   // MEXC
              run_B: 'blank.yml'     // BYBIT
            };
            const otherEvent = eventType === 'run_A' ? 'run_B' : 'run_A';
            const otherFile  = workflowFiles[otherEvent];
            console.log(`[A3-ROUTER] Mode: "${mode}"`);
            console.log(`[A3-ROUTER] Regime: "${regime}"`);
            console.log(`[A3-ROUTER] Dispatching: ${eventType} → ${workflowFiles[eventType]}`);
            // Cancel the opposite workflow (in_progress + queued)
            try {
              for (const status of ['in_progress', 'queued']) {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: otherFile,
                  status
                });
                for (const run of runs.data.workflow_runs) {
                  console.log(`[A3-ROUTER] Cancelling ${otherFile} ${status} #${run.id}`);
                  await github.rest.actions.cancelWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id
                  });
                }
              }
            } catch (e) {
              console.log(`[A3-ROUTER] Cancel error: ${e.message}`);
            }
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: eventType
            });
            console.log(`✅ Dispatched ${eventType}`);
            // ➕ NEW: Also trigger A1 (restart the loop)
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'run_A1'
            });
            console.log('✅ Dispatched run_A1');
