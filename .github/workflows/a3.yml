name: 🔄 A3 (8 min)

on:
  repository_dispatch:
    types: [run_A3]

permissions:
  actions: write
  contents: write

concurrency:
  group: a3-router
  cancel-in-progress: true

jobs:
  a3:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🚀 A3 Work
        run: |
          echo "⏳ A3 started at $(date)"
          sleep 60
          echo "✅ A3 done at $(date)"

      - name: 🔍 Fetch regime from Worker
        id: regime
        env:
          WORKER_JSON_URL: ${{ secrets.WORKER_JSON_URL }}
        run: |
          set +e
          JSON=$(curl -fsS --max-time 10 "${WORKER_JSON_URL}")
          EXIT=$?
          if [[ $EXIT -ne 0 || -z "$JSON" ]]; then
            echo "⚠️ Regime fetch failed (exit=$EXIT)"
            REGIME="Unknown"
          else
            REGIME=$(node -e "try{const j=JSON.parse(process.argv[1]);console.log(j.regime?.regime||'Unknown')}catch{console.log('Unknown')}" "$JSON")
          fi
          echo "regime=$REGIME" >> "$GITHUB_OUTPUT"
          echo "✅ Fetched regime: $REGIME"

      - name: 🔁 Route — Dead Market → B, else A
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const regime = `${{ steps.regime.outputs.regime }}`.trim();
            const isDead = regime === 'Dead Market';
            const eventType = isDead ? 'run_B' : 'run_A';

            console.log(`[A3-ROUTER] regime="${regime}" → ${eventType}`);

            // ✅ Define workflow FILE NAMES (NOT names)
            const workflowFiles = {
              run_A: 'a.yml',
              run_B: 'b.yml'
            };

            const otherEvent = isDead ? 'run_A' : 'run_B';
            const otherWorkflowFile = workflowFiles[otherEvent];

            try {
              console.log(`[A3-ROUTER] Checking in-progress runs of ${otherWorkflowFile}`);

              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: otherWorkflowFile,
                status: 'in_progress'
              });

              for (const run of runs.data.workflow_runs) {
                console.log(`[A3-ROUTER] Cancelling run #${run.id}`);
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
              }

            } catch (e) {
              console.log(`[A3-ROUTER] Cancel check skipped: ${e.message}`);
            }

            // ✅ Dispatch correct workflow
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: eventType
            });

            console.log(`✅ Dispatched ${eventType}`);
