name: 🔄 A3 (8 min)

on:
  repository_dispatch:
    types: [run_A3]

permissions:
  actions: write
  contents: write

concurrency:
  group: a3-router
  cancel-in-progress: true

jobs:
  a3:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🚀 A3 Work
        run: |
          echo "⏳ A3 started at $(date)"
          sleep 60
          echo "✅ A3 done at $(date)"

      - name: 🔍 Fetch live regime from Worker 1 (balance monitor)
        id: regime
        env:
          WORKER_REGIME_URL: ${{ secrets.WORKER_REGIME_URL }}
        run: |
          set +e
          echo "[DEBUG] Fetching regime from: ${WORKER_REGIME_URL}/regime"
          JSON=$(curl -fsS --max-time 10 "${WORKER_REGIME_URL}/regime")
          EXIT=$?
          echo "[DEBUG] Exit code: $EXIT"
          echo "[DEBUG] Raw response: $JSON"
          
          if [[ $EXIT -ne 0 || -z "$JSON" ]]; then
            echo "⚠️ Regime fetch failed (exit=$EXIT) — defaulting to ACTIVE"
            JSON='{}'
          fi
          
          REG=$(node -e "
            try {
              const j = JSON.parse(process.argv[1]);
              console.log(j.regime || 'Unknown');
            } catch(e) {
              console.log('Unknown');
            }
          " "$JSON")
          echo "regime=$REG" >> "$GITHUB_OUTPUT"
          echo "✅ Fetched regime: $REG"

      - name: 🔁 Route — Dead Market → B, anything else → A
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          WORKER_PUSH_URL: ${{ secrets.WORKER_PUSH_URL }}
        script: |
          const regime = `${{ steps.regime.outputs.regime }}`.trim();
          const isDead = regime === 'Dead Market';
          const eventType = isDead ? 'run_B' : 'run_A';

          console.log(`[A3-ROUTER] regime="${regime}" → ${eventType}`);

          // Determine which pipeline to cancel (the one we're NOT running)
          const otherEvent = isDead ? 'run_A' : 'run_B';
          const workflowNameMap = { 
            'run_A': 'Ideas Pusher (MEXC Ultimate 7.7.8)',
            'run_B': 'Ideas Pusher (Bybit Ultimate 1.0.0)'
          };
          const otherWorkflowName = workflowNameMap[otherEvent];

          try {
            console.log(`[A3-ROUTER] Checking for in-progress runs of "${otherWorkflowName}"...`);
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: otherWorkflowName,
              status: 'in_progress'
            });
            
            if (runs.data.workflow_runs.length > 0) {
              for (const run of runs.data.workflow_runs) {
                console.log(`[A3-ROUTER] Cancelling in-progress "${otherWorkflowName}" run #${run.id}`);
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
              }
            } else {
              console.log(`[A3-ROUTER] No in-progress runs of "${otherWorkflowName}" found`);
            }
          } catch(e) {
            console.log(`[A3-ROUTER] Cancel check failed (non-fatal): ${e.message}`);
          }

          // Dispatch the correct pipeline
          console.log(`[A3-ROUTER] Dispatching ${eventType}...`);
          await github.rest.repos.createDispatchEvent({
            owner: context.repo.owner,
            repo: context.repo.repo,
            event_type: eventType
          });

          console.log(`✅ Dispatched ${eventType}`);
          console.log(`[A3-ROUTER] Worker 2 (push) URL: ${process.env.WORKER_PUSH_URL}`);
