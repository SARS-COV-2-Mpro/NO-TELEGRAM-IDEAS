name: 🔄 A3 (8 min)

on:
  repository_dispatch:
    types: [run_A3]
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write

concurrency:
  group: a3-router
  cancel-in-progress: true

jobs:
  a3:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🚀 A3 Work
        run: |
          echo "⏳ A3 started at $(date)"
          sleep 60
          echo "✅ A3 done at $(date)"

      - name: 🔍 Fetch regime from Worker
        id: regime
        env:
          WORKER_JSON_URL: ${{ secrets.WORKER_JSON_URL }}
        run: |
          set +e
          echo "🔗 Fetching from Worker..."
          JSON=$(curl -fsS --max-time 10 "${WORKER_JSON_URL}")
          EXIT_CODE=$?

          echo "📦 RAW JSON RECEIVED:"
          echo "$JSON"
          echo "🔢 Curl Exit Code: $EXIT_CODE"

          if [[ $EXIT_CODE -ne 0 || -z "$JSON" ]]; then
            echo "⚠️ Fetch failed"
            REGIME="Unknown"
          else
            REGIME=$(node -e "try{const j=JSON.parse(process.argv[1]);console.log(j.regime?.regime||'Unknown')}catch(e){console.log('Unknown')}" "$JSON")
          fi

          echo "regime=$REGIME" >> "$GITHUB_OUTPUT"
          echo "✅ Final Regime: $REGIME"

      - name: 🔁 Route — Dead Market → B (Bybit), else A (MEXC)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const regime = `${{ steps.regime.outputs.regime }}`.trim();
            const isDead = regime === 'Dead Market';
            const eventType = isDead ? 'run_B' : 'run_A';

            console.log(`[A3-ROUTER] Regime: "${regime}"`);
            console.log(`[A3-ROUTER] Dispatching: ${eventType}`);

            // ✅ Your actual workflow file names
            const workflowFiles = {
              run_A: 'blank2.yml',  // MEXC Ultimate
              run_B: 'blank.yml'    // Bybit Ultimate
            };

            const otherEvent = isDead ? 'run_A' : 'run_B';
            const otherFile = workflowFiles[otherEvent];

            // Cancel the opposite workflow if running
            try {
              console.log(`[A3-ROUTER] Checking for running: ${otherFile}`);
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: otherFile,
                status: 'in_progress'
              });

              if (runs.data.workflow_runs.length === 0) {
                console.log(`[A3-ROUTER] No running instances of ${otherFile}`);
              }

              for (const run of runs.data.workflow_runs) {
                console.log(`[A3-ROUTER] Cancelling ${otherFile} run #${run.id}`);
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
              }

              // Also cancel queued ones
              const queued = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: otherFile,
                status: 'queued'
              });

              for (const run of queued.data.workflow_runs) {
                console.log(`[A3-ROUTER] Cancelling queued ${otherFile} run #${run.id}`);
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
              }

            } catch (e) {
              console.log(`[A3-ROUTER] Cancel check error: ${e.message}`);
            }

            // Dispatch the correct workflow
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: eventType
            });

            console.log(`✅ Successfully dispatched ${eventType}`);
